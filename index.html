<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Capacity Plan by Province</title>
<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--mute:#5f6d7e;--line:#e1e6ed;--soft:#f0f3f8;--c1:#2f6fd6;--c2:#e08a1e;--c3:#1f9d8a;--c4:#8a5cc2;--c5:#c8553d;--c6:#6b7a8d;--good:#1b8f5a;--bad:#c9382f;--warn:#b7791f;--accent:#2f6fd6;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#181e27;--ink:#e7ecf3;--mute:#98a5b6;--line:#2a3441;--soft:#1f2732;--c1:#5b93f0;--c2:#f0a640;--c3:#3cc5ae;--c4:#a98be0;--c5:#e5806a;--c6:#8c9bb0;--good:#3dc884;--bad:#ef6b62;--warn:#e0a84a;--accent:#5b93f0;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--card:#181e27;--ink:#e7ecf3;--mute:#98a5b6;--line:#2a3441;--soft:#1f2732;--c1:#5b93f0;--c2:#f0a640;--c3:#3cc5ae;--c4:#a98be0;--c5:#e5806a;--c6:#8c9bb0;--good:#3dc884;--bad:#ef6b62;--warn:#e0a84a;--accent:#5b93f0;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:1320px;margin:0 auto;padding:0 16px 40px}
h1{font-size:20px;margin:14px 0 0;letter-spacing:-.01em}h1 span{font-weight:400;color:var(--mute);font-size:14px;margin-left:6px}
h3{margin:0;font-size:15px}h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.tag{margin:2px 0 0;color:var(--mute);font-size:12px}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scenrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px}
.slab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.schip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px}
.schip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rename,.descin{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit}
.rename{width:130px;margin-left:8px;font-weight:600}.descin{flex:1;min-width:220px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;transition:opacity .15s}.kpis.pending{opacity:.55}
.kpis>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kpis i{display:block;font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.kpis b{display:block;font-size:21px;letter-spacing:-.01em;margin-top:1px}.kpis em{display:block;font-style:normal;font-size:11.5px;color:var(--mute)}
.kpis .ok b{color:var(--good)}.kpis .no b{color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--mute);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.sub{margin:3px 0 0;color:var(--mute);font-size:12.5px;max-width:760px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.inputs{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;align-items:start}
.inleft{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:calc(100vh - 70px);overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 10px}
.stat{background:var(--soft);border-radius:10px;padding:9px 11px}.slabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.sval{font-size:19px;font-weight:700;margin-top:1px}.ssub{font-size:11.5px;color:var(--mute)}.stat.good .sval{color:var(--good)}.stat.bad .sval{color:var(--bad)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.row.wrap{row-gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px}.flabel{color:var(--mute);font-weight:600}.flabel em{font-style:normal;font-weight:400;margin-left:6px;font-size:11px}
.numwrap{display:inline-flex;align-items:center;gap:3px}.suf{color:var(--mute);font-size:12px}
input.num,select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 7px;font:inherit;font-size:13px}
input.num:focus,select:focus,.rename:focus,.descin:focus{outline:2px solid var(--accent);outline-offset:0}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);padding:5px 10px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:transparent}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sliderwrap{display:inline-flex;align-items:center;gap:8px}.sliderwrap input{width:150px;accent-color:var(--accent)}.sliderwrap b{min-width:46px;font-size:12.5px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.note{color:var(--mute);font-size:12px;margin:6px 0}
.tscroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.t.sm td,.t.sm th{padding:5px 7px}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.t td.strong,.t tr.strong td{font-weight:700}
.t.dash tbody tr{cursor:pointer}.t tbody tr:hover{background:var(--soft)}.t tr.active{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.t tr.recon td{color:var(--mute);font-style:italic}.t tr.prov td{padding-top:3px;padding-bottom:3px}
.mute{color:var(--mute)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.desc{font-size:11.5px;color:var(--mute);font-weight:400;max-width:330px;white-space:normal;margin-top:2px}
.pill{background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}.chip{background:var(--soft);border-radius:6px;padding:2px 7px;font-size:11.5px;white-space:nowrap}
.mrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;margin:6px 0}.mlabel{width:100%;font-size:12px;font-weight:600;color:var(--mute)}
.mcell{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--mute)}.mgrid{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0}
.sparkline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;margin-top:8px;color:var(--ink)}.sparkline i{font-style:normal;color:var(--mute);margin-right:4px;font-size:10.5px}
.chartbox{min-width:0}.svgscroll{overflow-x:auto}svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mute);margin:2px 0 6px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:12px;height:10px;border-radius:2px}
.tick{fill:var(--mute);font-size:10.5px}.wval{fill:var(--ink);font-size:11px;font-weight:700}.grid{stroke:var(--line);stroke-width:1}.ref{stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1.2}.conn{stroke:var(--mute);stroke-width:1;stroke-dasharray:2 2}
.chartnote{font-size:11.5px;color:var(--mute);margin:4px 0 0}
.heat{display:grid;gap:2px;font-size:10.5px;overflow-x:auto;min-width:620px}.hc{border-radius:3px;text-align:center;padding:5px 0;font-variant-numeric:tabular-nums}.hl{display:flex;align-items:center;color:var(--mute);font-weight:600}.hh{text-align:center;color:var(--mute)}
.steps,.gaps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
footer{margin-top:24px;color:var(--mute);font-size:12px}
@media (max-width:1050px){.inputs{grid-template-columns:1fr}.sticky{position:static;max-height:none}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.app{padding:0 10px 30px}h1 span{display:block;margin:2px 0 0}.rename{margin-left:0}.card{padding:12px}}

.t.dash td:nth-child(2){min-width:280px}.t.dash td:nth-child(11){min-width:250px}.t.dash .desc{max-width:none}
textarea.paste{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-bottom:8px}
input.opt{background:var(--card)}.inl{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.t.gap td{min-width:44px}.t.fte td:first-child,.t.fte th:first-child{position:sticky;left:0;background:var(--card);min-width:200px}
.note.bad{color:var(--bad)}
.tabstrip{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sec{padding:10px 14px}.sechead{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:4px 0}
.sechead b{font-size:14px}.sechead em{font-style:normal;color:var(--mute);font-size:12px}
table.sheet{font-size:11.5px}.sheet th,.sheet td{padding:3px 5px;min-width:34px}.sheet .fc{position:sticky;left:0;background:var(--card);min-width:150px;z-index:1;font-weight:600;text-align:left}
.sheet th.mh{text-align:center;background:var(--soft);border-left:2px solid var(--line)}.sheet th.dh{font-size:9.5px}
.sheet td.hot{background:rgba(201,56,47,.18)}.sheet tr.tot td{background:var(--soft)}
.blk{display:inline-flex;align-items:center;gap:3px;background:var(--soft);padding:3px 6px;border-radius:8px}.blk i{font-style:normal;color:var(--mute);font-size:11px}
input.fill{background:var(--soft);font-size:11.5px}.pastewrap{position:relative;display:inline-block}.pastebox{position:absolute;right:0;top:34px;z-index:30;width:420px;max-width:80vw;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
input.txt{width:150px;text-align:left}
</style>

// ---------- Erlang C ----------
function erlangMin(A, ratio, target, minN) {
  if (A <= 1e-9) return minN;
  let B = 1;
  for (let n = 1; n < 3000; n++) {
    B = A * B / (n + A * B);
    if (n > A) {
      const C = n * B / (n - A * (1 - B));
      const sl = 1 - C * Math.exp(-(n - A) * ratio);
      if (sl >= target && n >= minN) return n;
    }
  }
  return 3000;
}
function slInt(N, A, ratio) {
  if (A <= 1e-9) return { sl: 1, asa: 0 };
  if (N <= A) return { sl: 0, asa: 999 };
  let B = 1;
  for (let n = 1; n <= N; n++) B = A * B / (n + A * B);
  const C = N * B / (N - A * (1 - B));
  return { sl: Math.max(0, 1 - C * Math.exp(-(N - A) * ratio)), asa: C / (N - A) };
}
// returns {sl, asaUnits}; asa (minutes) = asaUnits * AHT
function slFrac(N, A, ratio) {
  const lo = Math.floor(N), hi = Math.ceil(N);
  const a = slInt(lo, A, ratio);
  if (hi === lo) return a;
  const b = slInt(hi, A, ratio), w = N - lo;
  return { sl: a.sl + (b.sl - a.sl) * w, asa: Math.min(999, a.asa + (b.asa - a.asa) * w) };
}

function getSubs(p) {

function buildDemand(p) {
  const subs = getSubs(p), vol = { int:{}, clin:{} };
  ['int','clin'].forEach(ch => {

  return { subs, vol };
}

function aggregate(raw, cfg) {
  const L = cfg.blockLen, out = new Float64Array(168);
  for (let d = 0; d < 7; d++) for (let b = 0; b < 24; b += L) {

    let v = cfg.agg === 'max' ? mx : sm / L;
    if (cfg.roundUp) v = Math.ceil(v - 1e-9);
    for (let h = b; h < b + L; h++) out[d*24+h] = v;
  }
  return out;
}

  return { ch, cph, sla, occ, minCov, adj, ratio: sla.mins * cph / (60 * occ), ca: ch === 'int' ? p.caRatio[r] : 0 };
}

}

function phasePlan(Sm, p) {
  const M = [], O = [], T = [];
  for (let m = 0; m < 12; m++) { M.push(new Float64Array(168)); O.push(new Float64Array(168)); T.push(new Float64Array(168)); }
  MASTER_BLOCKS.forEach(blk => { for (let s = 0; s < 168; s++) {
    let mn = Infinity; blk.forEach(m => { if (Sm[m][s] < mn) mn = Sm[m][s]; });
    const v = Math.floor(Math.max(0, mn * (1 - p.masterRed)) + 1e-9); blk.forEach(m => { M[m][s] = v; }); } });
  OPEN_BLOCKS.forEach(blk => { for (let s = 0; s < 168; s++) {
    let mn = Infinity; blk.forEach(m => { const v = Sm[m][s] - M[m][s]; if (v < mn) mn = v; });
    const v = Math.floor(Math.max(0, mn * (1 - p.openRed)) + 1e-9); blk.forEach(m => { O[m][s] = v; }); } });
  for (let m = 0; m < 12; m++) for (let s = 0; s < 168; s++) T[m][s] = Math.max(0, Sm[m][s] - M[m][s] - O[m][s]);
  return { M, O, T };
}

// pool: 'clin' (providers) or 'int' (intake = CA pool + CM pool). Demand is pooled for Erlang; the plan is then split by CA:CM ratio.
function runPool(p, dem, pool, r, full) {
  const meta = poolMeta(p, pool, r), cfg = p.engine;
  const lamM = [], Sm = [];
  for (let m = 0; m < 12; m++) {
    const weekly = dem.vol[meta.ch][r][m] / WEEKS[m];
    const lam = new Float64Array(168); for (let s = 0; s < 168; s++) lam[s] = weekly * PROF[s];
    const raw = rawRequirement(lam, meta, cfg.supplyModel);
    const B = aggregate(raw, cfg);
    const S = new Float64Array(168);
    for (let s = 0; s < 168; s++) S[s] = Math.max(meta.minCov, B[s] * (1 + meta.adj));
    lamM.push(lam); Sm.push(S);
  }
  const rho = meta.ca, Sca = [], Scm = [];
  for (let m = 0; m < 12; m++) { const a = new Float64Array(168), c = new Float64Array(168);
    for (let s = 0; s < 168; s++) { a[s] = Sm[m][s] * rho; c[s] = Sm[m][s] - a[s]; } Sca.push(a); Scm.push(c); }
  const { M, O, T } = phasePlan(pool === 'clin' ? Sm : Scm, p);
  const months = [], slArr = [], asaArr = [], Seffm = [];
  for (let m = 0; m < 12; m++) {
    const w = WEEKS[m]; let hM = 0, hO = 0, hT = 0, hCA = 0, hPlan = 0, slNum = 0, asaNum = 0, den = 0;
    const Seff = new Float64Array(168), sl = full ? new Float64Array(168) : null, asa = full ? new Float64Array(168) : null;
    const aht = 60 / meta.cph * meta.occ;
    for (let s = 0; s < 168; s++) {
      hM += M[m][s]*w; hO += O[m][s]*w; hT += p.topUpFill*T[m][s]*w; hCA += Sca[m][s]*w; hPlan += Sm[m][s]*w;
      Seff[s] = Sca[m][s] + M[m][s] + O[m][s] + p.topUpFill * T[m][s];
      const Aload = lamM[m][s] / meta.cph * meta.occ;
      const e = slFrac(Seff[s], Aload, meta.ratio);
      slNum += lamM[m][s] * e.sl; asaNum += lamM[m][s] * Math.min(999, e.asa * aht); den += lamM[m][s];
      if (full) { sl[s] = e.sl; asa[s] = Math.min(999, e.asa * aht); }
    }
    months.push({ planned: hPlan, hM, hO, hT, hCA, slNum: slNum * w, asaNum: asaNum * w, den: den * w });
    Seffm.push(Seff); if (full) { slArr.push(sl); asaArr.push(asa); }
  }
  return { months, meta, full: full ? { lam: lamM, S: Sm, Sca, Scm, M, O, T, Seff: Seffm, sl: slArr, asa: asaArr } : null };
}

function rates(p) {
  const k = 1 + p.infl, kb = 1 + INFL_BASE;
  const clin = {}; REG.forEach(r => { clin[r] = RATE27_CLIN[r] / kb * k; });
  return { clin, cm: CM_RATE_26 * k, ca: CA_RATE_26 * k };
}

function runScenario(p) {
  const dem = buildDemand(p), rt = rates(p);
  const months = MONTHS.map((_, m) => ({ subs: dem.subs[m], consInt: 0, consClin: 0,
    hrs: { clin:0, cm:0, ca:0 }, cost: { clin:0, cm:0, ca:0 }, hM:0, hO:0, hT:0, topPrem:0, slI:{n:0,d:0,a:0}, slC:{n:0,d:0,a:0} }));
  const byRegion = { clin:{}, cm:{}, ca:{} };
  REG.forEach(r => {
    ['clin','int'].forEach(pool => {
      const res = runPool(p, dem, pool, r, false);
      const acc = { clin:{h:0,c:0}, cm:{h:0,c:0}, ca:{h:0,c:0} };
      res.months.forEach((mm, m) => {
        const M = months[m];
        if (pool === 'clin') {
          const pf = p.paidF.clin[r], rate = rt.clin[r];
          const hp = (mm.hM + mm.hO + mm.hT) * pf, prem = mm.hT * pf * rate * p.topUpPremium;
          M.hrs.clin += hp; M.cost.clin += hp * rate + prem; M.topPrem += prem;
          M.hM += mm.hM * pf; M.hO += mm.hO * pf; M.hT += mm.hT * pf;
          acc.clin.h += hp; acc.clin.c += hp * rate + prem;
          M.slC.n += mm.slNum; M.slC.d += mm.den; M.slC.a += mm.asaNum; M.consClin += mm.den;
        } else {
          const pfm = p.paidF.cm[r], pfa = p.paidF.ca[r];
          const hcm = (mm.hM + mm.hO + mm.hT) * pfm, hca = mm.hCA * pfa;
          const prem = mm.hT * pfm * rt.cm * p.topUpPremium;
          M.hrs.cm += hcm; M.hrs.ca += hca; M.cost.cm += hcm * rt.cm + prem; M.cost.ca += hca * rt.ca; M.topPrem += prem;
          M.hM += mm.hM * pfm; M.hO += mm.hO * pfm; M.hT += mm.hT * pfm;
          acc.cm.h += hcm; acc.cm.c += hcm * rt.cm + prem; acc.ca.h += hca; acc.ca.c += hca * rt.ca;
          M.slI.n += mm.slNum; M.slI.d += mm.den; M.slI.a += mm.asaNum; M.consInt += mm.den;
        }
      });
      if (pool === 'clin') byRegion.clin[r] = { hrs: acc.clin.h, cost: acc.clin.c };
      else { byRegion.cm[r] = { hrs: acc.cm.h, cost: acc.cm.c }; byRegion.ca[r] = { hrs: acc.ca.h, cost: acc.ca.c }; }
    });
  });
  const tot = { clin:0, cm:0, ca:0, hrsClin:0, hrsCm:0, hrsCa:0, hM:0, hO:0, hT:0, topPrem:0, sIn:0, sId:0, sCn:0, sCd:0, aI:0, aC:0, consInt:0, consClin:0 };
  months.forEach(M => {
    M.slInt = M.slI.d ? M.slI.n / M.slI.d : 1; M.slClin = M.slC.d ? M.slC.n / M.slC.d : 1;
    M.asaInt = M.slI.d ? M.slI.a / M.slI.d : 0; M.asaClin = M.slC.d ? M.slC.a / M.slC.d : 0;
    M.fixed = p.stipend / 12 + p.other / 12; M.ah = p.ah / 12;
    M.pc = M.cost.clin + M.cost.cm + M.cost.ca + M.fixed; M.total = M.pc + M.ah;
    tot.clin += M.cost.clin; tot.cm += M.cost.cm; tot.ca += M.cost.ca; tot.hrsClin += M.hrs.clin; tot.hrsCm += M.hrs.cm; tot.hrsCa += M.hrs.ca;
    tot.hM += M.hM; tot.hO += M.hO; tot.hT += M.hT; tot.topPrem += M.topPrem;
    tot.sIn += M.slI.n; tot.sId += M.slI.d; tot.sCn += M.slC.n; tot.sCd += M.slC.d; tot.aI += M.slI.a; tot.aC += M.slC.a;
    tot.consInt += M.consInt; tot.consClin += M.consClin;
  });
  const fixed = p.stipend + p.other;
  const pc = tot.clin + tot.cm + tot.ca + fixed;
  return { months, byRegion, dem,
    totals: { clin: tot.clin, cm: tot.cm, ca: tot.ca, intake: tot.cm + tot.ca, fixed, pc, ah: p.ah, total: pc + p.ah,
      hrsClin: tot.hrsClin, hrsCm: tot.hrsCm, hrsCa: tot.hrsCa, hM: tot.hM, hO: tot.hO, hT: tot.hT, topPrem: tot.topPrem,
      slInt: tot.sId ? tot.sIn / tot.sId : 1, slClin: tot.sCd ? tot.sCn / tot.sCd : 1,
      asaInt: tot.sId ? tot.aI / tot.sId : 0, asaClin: tot.sCd ? tot.aC / tot.sCd : 0,
      consInt: tot.consInt, consClin: tot.consClin, subsAvg: dem.subs.reduce((a,b)=>a+b,0)/12 } };
}

// Detail for the viewer: both supply models for a month/pool/region
function poolDetail(p, pool, r) {
  const dem = buildDemand(p), res = runPool(p, dem, pool, r, true), meta = res.meta;
  const det = [], erl = [];
  for (let m = 0; m < 12; m++) {
    det.push(rawRequirement(res.full.lam[m], meta, 'det'));
    erl.push(rawRequirement(res.full.lam[m], meta, 'erlang'));
  }
  return { meta, full: res.full, det, erl, months: res.months };
}

const clone = o => JSON.parse(JSON.stringify(o));

// Waterfall: sequentially move drivers from a 2026 reference to the scenario
function waterfall(p, baselineBudget) {
  const ref = clone(p);
  ref.subsMode = 'manual'; ref.subsManual = SUBS_2026.slice();
  ref.utilInt = UTIL_INT_26.slice(); ref.utilClin = UTIL_CLI_26.slice(); ref.utilAdj = 0;
  ref.autoInt = new Array(12).fill(0); ref.autoClin = new Array(12).fill(0);
  ref.cph = clone(CPH_BASE); ref.cphUpInt = 0; ref.cphUpClin = 0;
  ref.slaInt = { pct: 0.80, mins: 5 }; ref.slaClin = { pct: 0.85, mins: 60 }; ref.supplyAdjInt = REF_SUPPLY_ADJ; ref.supplyAdjClin = REF_SUPPLY_ADJ;
  ref.infl = 0; ref.ah = 1260889.19;
  const steps = [];
  let cur = clone(ref); const c0 = runScenario(cur).totals.total;
  const set = (label, key, fn) => { fn(cur); const c = runScenario(cur).totals.total; steps.push({ label, key, value: c }); };
  set('Subscriber Lives Growth', 'subs', q => { q.subsMode = p.subsMode; q.subsSeries = p.subsSeries; q.subsManual = p.subsManual; q.subStart = p.subStart; q.growthPct = p.growthPct; });
  set('Volume Growth / Utilization Shifts', 'util', q => { q.utilInt = p.utilInt.slice(); q.utilClin = p.utilClin.slice(); q.utilAdj = p.utilAdj; });
  set('Productivity Enhancements (CPH Changes)', 'cph', q => { q.cph = clone(p.cph); q.cphUpInt = p.cphUpInt; q.cphUpClin = p.cphUpClin; });
  set('Automation Savings (Volume Drops)', 'auto', q => { q.autoInt = p.autoInt.slice(); q.autoClin = p.autoClin.slice(); });
  set('SLA Adjustments', 'sla', q => { q.slaInt = clone(p.slaInt); q.slaClin = clone(p.slaClin); q.supplyAdjInt = p.supplyAdjInt; q.supplyAdjClin = p.supplyAdjClin; });
  set('Rate Inflation / COGS Adjustments', 'rate', q => { q.infl = p.infl; q.ah = p.ah; });
  const rows = []; let prev = c0;
  const recon = c0 - baselineBudget;
  steps.forEach(s => { rows.push({ label: s.label, key: s.key, delta: s.value - prev }); prev = s.value; });
  return { start: baselineBudget, recon, ref: c0, rows, final: prev };
}

root.Engine = { DIST, REF_SUPPLY_ADJ, MONTHS, DOW, DIM, WEEKS, REG, REG_NAME, PROF, PROFILE_RAW, SUBS_V1, SUBS_V2, SUBS_2026, UTIL_INT_27, UTIL_CLI_27, UTIL_INT_26, UTIL_CLI_26,
  CPH_BASE, CA_RATIO, PROV_SPLIT, RATE27_CLIN, SHEET_HOURS, DISTN, CONS_INT_27, CONS_CLI_27, CONS_INT_26, CONS_CLI_26,

if (typeof module !== 'undefined') module.exports = root.Engine;
})(typeof window !== 'undefined' ? window : globalThis);

<script>

// ---------- charts ----------
const PAL = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];

}

// Generic multi-series chart: types bar | stack | line | step ; axis l | r
function Chart({ labels, series, h = 250, yFmt = fmt0, y2Fmt = fmt0, y2Min = 0, y2Max, xEvery = 1, yMax, refL = [], refR = [], note }) {
  const W = 780, H = h, hasR = series.some(s => s.axis === 'r'), pl = 58, pr = hasR ? 52 : 14, pt = 10, pb = 28;

  const stacks = series.filter(s => s.type === 'stack'), bars = series.filter(s => s.type === 'bar');
  let maxL = 0, maxR = 0;

  refL.forEach(r => { maxL = Math.max(maxL, r.v); });

  const X = i => pl + (i + 0.5) * bw, yL = v => pt + ih - (v / maxL) * ih, yR = v => pt + ih - ((v - y2Min) / (maxR - y2Min)) * ih;

// Waterfall chart (truncated axis)
function WaterfallChart({ items }) {
  const W = 780, H = 360, pl = 64, pr = 14, pt = 24, pb = 74, n = items.length, iw = W - pl - pr, ih = H - pt - pb, bw = iw / n;
  let run = 0; const lev = [], after = [];
  items.forEach(it => { if (it.kind === 'total') { it.lo = 0; it.hi = it.value; run = it.value; } else { const a = run, b = run + it.value; it.lo = Math.min(a, b); it.hi = Math.max(a, b); run = b; } lev.push(it.lo, it.hi); after.push(run); });
  const mn = Math.min(...items.map(i => Math.min(i.lo, i.hi)).filter((v, k) => items[k].kind !== 'total'), ...items.filter(i => i.kind === 'total').map(i => i.value));
  const mx = Math.max(...items.map(i => i.hi));
  const rng = Math.max(mx - mn, 5e5), lo = Math.floor((mn - rng * 0.5) / 5e5) * 5e5, hi = Math.ceil((mx + rng * 0.18) / 5e5) * 5e5;
  const Y = v => pt + ih - ((v - lo) / (hi - lo)) * ih, X = i => pl + i * bw + bw / 2;
  const els = [];
  for (let k = 0; k <= 5; k++) { const v = lo + (hi - lo) * k / 5, y = Y(v);
    els.push(html`<line key=${'g' + k} x1=${pl} x2=${W - pr} y1=${y} y2=${y} className="grid" />`);
    els.push(html`<text key=${'t' + k} x=${pl - 6} y=${y + 3} textAnchor="end" className="tick">${'$' + (v / 1e6).toFixed(1) + 'M'}</text>`); }
  let prevTop = null;
  items.forEach((it, i) => {
    const x = X(i) - bw * 0.34, w = bw * 0.68, y1 = Y(it.kind === 'total' ? it.value : it.hi), y2 = Y(it.kind === 'total' ? lo : it.lo);
    const col = it.kind === 'total' ? 'var(--c1)' : it.kind === 'recon' ? 'var(--mute)' : it.value >= 0 ? 'var(--bad)' : 'var(--good)';
    els.push(html`<rect key=${'r' + i} x=${x} y=${y1} width=${w} height=${Math.max(2, y2 - y1)} rx="2" style=${{ fill: col, opacity: it.kind === 'recon' ? 0.55 : 0.92 }}><title>${it.label + ': ' + (it.kind === 'total' ? money(it.value) : signMoney(it.value))}</title></rect>`);
    const lbl = it.kind === 'total' ? moneyM(it.value) : signMoneyM(it.value);
    els.push(html`<text key=${'v' + i} x=${X(i)} y=${y1 - 5} textAnchor="middle" className="wval">${lbl}</text>`);
    wrapText(it.label, 15).forEach((ln, k) => els.push(html`<text key=${'xl' + i + '_' + k} x=${X(i)} y=${H - pb + 16 + k * 12} textAnchor="middle" className="tick">${ln}</text>`));
    if (i < n - 1) { const yy = Y(after[i]); els.push(html`<line key=${'c' + i} x1=${x + w} x2=${X(i + 1) - bw * 0.34} y1=${yy} y2=${yy} className="conn" />`); }
  });
  return html`<div className="chartbox"><div className="legend"><span><i style=${{ background: 'var(--c1)' }}></i>Budget total</span><span><i style=${{ background: 'var(--bad)' }}></i>Cost increase</span><span><i style=${{ background: 'var(--good)' }}></i>Cost reduction</span><span><i style=${{ background: 'var(--mute)' }}></i>Reconciliation</span></div>
  <div className="svgscroll"><svg viewBox=${'0 0 ' + W + ' ' + H} style=${{ minWidth: 640 }} role="img">${els}</svg></div><p className="chartnote">Vertical axis is truncated (starts at ${'$' + (lo / 1e6).toFixed(1) + 'M'}) so the driver steps are visible.</p></div>`;
}

function Heat({ data, fmt, max, hue = 'blue', rowLabels, title }) {
  const mx = max != null ? max : Math.max(1e-9, ...data.flat());
  const cell = (v, k) => { const a = Math.min(1, Math.max(0, v / mx)); const bg = hue === 'blue' ? `rgba(47,111,214,${0.07 + a * 0.85})` : `rgba(31,157,99,${0.07 + a * 0.85})`;
    return html`<div key=${k} className="hc" style=${{ background: bg, color: a > 0.55 ? '#fff' : 'var(--ink)' }} title=${fmt(v)}>${fmt(v)}</div>`; };
  return html`<div className="heat" style=${{ gridTemplateColumns: '38px repeat(24,1fr)' }}>
    <div className="hl"></div>${Array.from({ length: 24 }, (_, h) => html`<div key=${'h' + h} className="hh">${h}</div>`)}
    ${data.map((row, d) => [html`<div key=${'r' + d} className="hl">${rowLabels[d]}</div>`].concat(row.map((v, h) => cell(v, d + '_' + h))))}</div>`;
}

const SHEET_JAN = { QC:[7044, 6913, 4439], ON:[4118, 3884, 2360], BC:[1747, 1658, 1061], AB:[1319, 1402, 200], NB:[650, 948, 409], NS:[754, 1032, 469], NL:[1028, 1308, 323], SK:[372, 744, 236], MB:[372, 744, 326], PE:[372, 744, 218] };
function HoursTab({ p, set, run }) {
  const [pool, setPool] = useState('clin'), [mo, setMo] = useState(0);
  const team = pool === 'clin' ? 'clin' : 'int';
  const ids = pool === 'clin' ? clinIds : REGIONS;
  const ovSet = (kind, id, v) => { const key = team + ':' + id, arr = (p.ov[kind][key] || new Array(12).fill(null)).slice(); arr[mo] = v; set(['ov', kind, key], arr); };
  const ovGet = (kind, id) => (p.ov[kind][team + ':' + id] || [])[mo];
  const rows = ids.map(id => ({ id, m: pool === 'clin' ? (run.units.clin[id] ? run.units.clin[id].months : null) : run.units.int[id].months })).filter(r => r.m);
  const totH = MONTHS.map((_, m) => sum(rows.map(r => r.m[m].plannedH)));
  const rate = (id) => (pool === 'clin' ? run.rates.clin[id][mo] : run.rates.cm[mo]);
  return html`<div className="stack">
    <${Card} title="Hours and cost" sub="Hours follow the province tabs: hourly supply = MAX(ROUND(demand ÷ CPH),1), reduced by availability, averaged into shift blocks, then Master → Open → Top-up over the Nov–Oct cycle. Blank override boxes use the computed value."
      right=${html`<${Seg} value=${pool} onChange=${setPool} options=${[{ v: 'clin', l: 'Clinical NPs' }, { v: 'int', l: 'Intake (CM + CA)' }]} />`}>
      <div className="row"><${Field} label="Supply requirement"><${Seg} value=${p.supplyModel} onChange=${v => set(['supplyModel'], v)} options=${[{ v: 'sheet', l: 'Sheet: MAX(ROUND(÷ CPH),1)' }, { v: 'erlang', l: 'Erlang C / SLA' }]} /><//>
        <${Field} label="Master buffer"><${Slider} value=${p.engine.masterRed} min=${0} max=${0.6} step=${0.01} onChange=${v => set(['engine', 'masterRed'], v)} fmt=${v => (v * 100).toFixed(0) + '%'} /><//>
        <${Field} label="Open buffer"><${Slider} value=${p.engine.openRed} min=${0} max=${0.6} step=${0.01} onChange=${v => set(['engine', 'openRed'], v)} fmt=${v => (v * 100).toFixed(0) + '%'} /><//>
        <${Field} label="Top-up fill"><${Slider} value=${p.engine.topFill} min=${0.5} max=${1} step=${0.01} onChange=${v => set(['engine', 'topFill'], v)} fmt=${v => (v * 100).toFixed(0) + '%'} /><//></div>
    <//>
    <${Card} title=${(pool === 'clin' ? 'Clinical' : 'Intake') + ' · planned hours by month'} sub="Scheduled (block) hours after availability and any override. Intake rows are CM blocks + CA hourly requirement.">
      <div className="tscroll"><table className="t sm"><thead><tr><th>${pool === 'clin' ? 'Province' : 'Region'}</th><th>Availability %</th>${MONTHS.map(m => html`<th key=${m} className="r">${m}</th>`)}<th className="r">Total</th><th className="r">Cost</th></tr></thead><tbody>
        ${rows.map(r => { const cs = pool === 'clin' ? run.cost.clin[r.id] : run.cost.cm[r.id].map((c, i) => ({ master: c.master + run.cost.ca[r.id][i].master, open: c.open, top: c.top })); return html`<tr key=${r.id}><td><b>${nameOf(pool === 'clin' ? 'clin' : 'int', r.id)}</b></td>
          <td><${Num} value=${p.avail[team][r.id]} pct=${true} dec=${0} step=${1} min=${10} max=${200} width=${62} suffix="%" onChange=${v => set(['avail', team, r.id], v)} /></td>

        <tr className="strong"><td colSpan="2">Total</td>${totH.map((v, i) => html`<td key=${i} className="r">${hn(v)}</td>`)}<td className="r">${hn(sum(totH))}</td><td></td></tr></tbody></table></div>
      ${pool === 'clin' ? html`<p className="note">Availability defaults are the Supply Availability cells on each province tab (QC 95, ON 90, BC 85, AB 88, NB/NS/NL 80; MB, SK, PE 100).</p>` : html`<p className="note">Availability on an intake tab reduces CM supply only; CA supply is the remainder of the single contact centre requirement.</p>`}
    <//>
    <${Card} title=${'Top-ups tracker · ' + MONTHS[mo] + ' 2027'} sub="Same columns as the Top Ups tab. Type into Hours / Master / Open / Released to overwrite a computed value; clear the box to go back."
      right=${html`<${Field} label="Month"><select value=${mo} onChange=${e => setMo(+e.target.value)}>${MONTHS.map((m, i) => html`<option key=${m} value=${i}>${m}</option>`)}</select><//>`}>
      <div className="tscroll"><table className="t sm"><thead><tr><th>${pool === 'clin' ? 'Province' : 'Region'}</th><th className="r">Forecast hrs</th><th className="r">Reduced forecast</th><th>Hours override</th><th className="r">Master</th><th>Master ovr.</th><th className="r">Open</th><th>Open ovr.</th><th className="r">Top-up req.</th><th>Released ovr.</th><th className="r">Released</th><th className="r">Remaining</th><th className="r">Rate</th><th className="r">Top-up cost</th><th className="r">Total cost</th>${pool === 'clin' && !(p.mode !== 'sheet') ? html`<th className="r mute">Sheet Jan</th>` : null}</tr></thead><tbody>
        ${rows.map(r => { const x = r.m[mo], fx = false; const cs = pool === 'clin' ? run.cost.clin[r.id][mo] : { master: run.cost.cm[r.id][mo].master + run.cost.ca[r.id][mo].master, open: run.cost.cm[r.id][mo].open, top: run.cost.cm[r.id][mo].top }; const sh = SHEET_JAN[r.id];
          return html`<tr key=${r.id}><td><b>${nameOf(pool === 'clin' ? 'clin' : 'int', r.id)}</b></td><td className="r">${hn(x.forecastH)}</td><td className="r">${hn(x.reducedH)}</td>
          <td><${OptNum} value=${ovGet('hours', r.id)} onChange=${v => ovSet('hours', r.id, v)} /></td>

          ${pool === 'clin' && p.mode === 'sheet' ? html`<td className="r mute">${sh && mo === 0 ? hn(sh[0]) + ' / ' + hn(sh[1]) + ' / ' + hn(sh[2]) : '–'}</td>` : null}</tr>`; })}</tbody></table></div>
      <p className="note">${pool === 'clin' ? 'Sheet Jan column shows Forecast / Reduced forecast / Current master hours from the Top Ups tab (January) for comparison.' : 'Care Assistants are a fixed-schedule pool: their share of the hours is costed directly and bypasses Master/Open/Top-up.'} Master and Open overrides rescale the computed hourly layers; top-up required is whatever is left.</p>
      <p className="note">Rates and stipends are entered by month on the Inputs tab (section 7).</p>
    <//></div>`;

// ================= FTE & HIRING =================
function FTETab({ p, set, run }) {
  const [pool, setPool] = useState('clin'), [id, setId] = useState('QC');
  const ids = pool === 'clin' ? clinIds : REGIONS;

    <${Sec} title=${intake ? 'Daily Supply Profile (single contact centre) · CM requirement · CA requirement' : 'Daily Supply Requirements Profile'} sub=${intake ? 'MAX(CEILING(demand ÷ CPH),1); CM = ROUNDUP(total ÷ ratio); CA = remainder' : 'MAX(ROUND(demand ÷ CPH, 0), 1) per hour (rows 64–91)'} open=${opn.sup} toggle=${() => tg('sup')}>
      <${Grid} sel=${sel} head=${intake ? 'Total supply' : 'Hour of Day'} rows=${hourRows} cell=${(m, h, d) => months[m].req[h][d]} totals=${[{ label: 'Total', fn: (m, d) => sum(months[m].req.map(r => r[d])) }]} />
      ${intake ? html`<h4>CM requirement</h4><${Grid} sel=${sel} head="CM" rows=${hourRows} cell=${(m, h, d) => months[m].cm[h][d]} totals=${[{ label: 'Total', fn: (m, d) => sum(months[m].cm.map(r => r[d])) }]} />
        <h4>CA requirement (fixed schedule — not released)</h4><${Grid} sel=${sel} head="CA" rows=${hourRows} cell=${(m, h, d) => months[m].caM[h][d]} totals=${[{ label: 'Total', fn: (m, d) => sum(months[m].caM.map(r => r[d])) }]} />` : null}<//>
    <${Sec} title=${intake ? 'CM supply after availability' : 'Supply Availability (reduced supply profile)'} sub=${'MAX(ROUND(requirement × ' + Math.round(mt.avail * 100) + '%, 0), 1) (rows 95–121)'} open=${opn.red} toggle=${() => tg('red')}>
      <${Grid} sel=${sel} head="Hour of Day" rows=${hourRows} cell=${(m, h, d) => months[m].red[h][d]} totals=${[{ label: 'Required (daily)', fn: (m, d) => months[m].reqDay[d] }]} /><//>
    <${Sec} title="Expected wait time and SLA" sub=${(p.slaMethod === 'erlang' ? 'Erlang C' : 'Sheet method (peak factors, capped ' + Math.round(p.slaCap * 100) + '%)') + ' · wait threshold ' + tgt.mins + ' min · ' + (p.slaBasis === 'scheduled' ? 'scheduled blocks' : 'reduced supply')} open=${opn.sla} toggle=${() => tg('sla')}>
      ${p.slaMethod === 'sheet' ? html`<h4>Consults in wait</h4><${Grid} sel=${sel} head="Hour" rows=${hourRows} cell=${(m, h, d) => months[m].sla.inW[h][d]} />` : null}
      <h4>Expected wait time (minutes)</h4><${Grid} sel=${sel} head="Hour" rows=${hourRows} fmt=${v => (v >= 100 ? '99+' : Math.round(v))} cell=${(m, h, d) => months[m].sla.wait[h][d]} hl=${(m, h, d, v) => v >= tgt.mins} />
      <h4>SLA by hour (share of consults waiting under ${tgt.mins} min)</h4><${Grid} sel=${sel} head="Hour" rows=${hourRows} fmt=${pctF} cell=${(m, h, d) => months[m].sla.hs[h][d]} hl=${(m, h, d, v) => v != null && v < tgt.pct}
        totals=${[{ label: 'Daily SLA', fn: (m, d) => months[m].sla.dsla[d], fmt: pctF }]} />
      <div className="stats">${sel.map(m => html`<${Stat} key=${m} label=${MONTHS[m] + ' SLA'} value=${pct1(months[m].sl)} sub=${'avg wait ' + fmt1(months[m].asa) + ' min'} tone=${months[m].sl >= tgt.pct ? 'good' : 'bad'} />`)}</div><//>
    <${Sec} title="Staffing Required by Blocks (reduction supply profile)" sub="ROUND(AVERAGE of reduced supply in each block) · block value is held for the Hrs Covered (rows 243–258)" open=${opn.blk} toggle=${() => tg('blk')}>
      <${Grid} sel=${sel} head="Hrs · Shift Block" rows=${blkRows} cell=${(m, b, d) => months[m].staff[b][d]}
        edit=${single ? (m, b, d, v) => ovCell('staff', m, b, d, v) : null}
        totals=${[{ label: 'Total hours', fn: (m, d) => months[m].totDay[d] }, { label: 'Required', fn: (m, d) => months[m].reqDay[d] }]} />
      <div className="stats"><${Stat} label=${MONTHS[sel[0]] + ' · Total staffed (hrs)'} value=${hn(months[sel[0]].staffed)} sub="Σ daily total × weekday counts" /><${Stat} label="Total reduced required (hrs)" value=${hn(months[sel[0]].reducedReq)} />${intake ? html`<${Stat} label="CA hours (fixed)" value=${hn(months[sel[0]].caH)} />` : null}<${Stat} label="Year · staffed" value=${hn(sum(months.map(x => x.staffed)))} /></div><//>
    <${Sec} title=${(intake ? 'CM ' : 'NP / MD ') + 'Master Assignment'} sub="Minimum of each block over the 6-month period (Nov–Apr, May–Oct) less the master buffer — or type the actual master schedule" open=${opn.mas} toggle=${() => tg('mas')}>
      <${Grid} sel=${sel} head="Hrs · Shift Block" rows=${blkRows} cell=${(m, b, d) => months[m].masterGrid[b][d]} edit=${single ? (m, b, d, v) => ovCell('master', m, b, d, v) : null}
        totals=${[{ label: 'Total hours', fn: (m, d) => sum(months[m].masterGrid.map((r, b) => r[d] * blocks[b][1])) }]} />
      <p className="note">Total monthly master hours: ${hn(months[sel[0]].master)} in ${MONTHS[sel[0]]}. Type a value to replace the computed master for a cell; clear it to go back.</p><//>
    <${Sec} title=${(intake ? 'CM ' : 'NP / MD ') + 'Open shifts'} sub="Remaining after master → 3-month minimum (Nov–Jan, Feb–Apr, May–Jun, Jul–Oct) less the open buffer" open=${opn.open} toggle=${() => tg('open')}>
      <h4>Open (remaining after master)</h4><${Grid} sel=${sel} head="Hrs · Shift Block" rows=${blkRows} cell=${(m, b, d) => months[m].openRem[b][d]} />
      <h4>3-month minimum open shift release</h4><${Grid} sel=${sel} head="Hrs · Shift Block" rows=${blkRows} cell=${(m, b, d) => months[m].openGrid[b][d]} edit=${single ? (m, b, d, v) => ovCell('open', m, b, d, v) : null}
        totals=${[{ label: 'Total hours', fn: (m, d) => sum(months[m].openGrid.map((r, b) => r[d] * blocks[b][1])) }]} /><//>
    <${Sec} title="Monthly add to total to monthly open (top-ups)" sub="Whatever is left after master and open (rows 308–321)" open=${opn.top} toggle=${() => tg('top')}>
      <${Grid} sel=${sel} head="Hrs · Shift Block" rows=${blkRows} cell=${(m, b, d) => months[m].topGrid[b][d]} totals=${[{ label: 'Total hours', fn: (m, d) => sum(months[m].topGrid.map((r, b) => r[d] * blocks[b][1])) }]} /><//>
    <${Sec} title="Hours and COGs" sub="Hours scheduled per month × rate" open=${opn.cogs} toggle=${() => tg('cogs')}>
      <div className="tscroll"><table className="t sm"><thead><tr><th className="fc">${nameOf(kind === 'clin' ? 'clin' : 'int', uid)} · ${intake ? 'CM at $' + fmt2(avg(run.rates.cm)) : '$' + fmt2(rate)}/hr (avg)</th>${MONTHS.map(m => html`<th key=${m} className="r">${m}</th>`)}<th className="r">Total</th></tr></thead><tbody>
        ${[['Master hours', x => x.master], ['Open hours', x => x.open], ['Top-up hours (needed)', x => x.topNeeded], ['Top-up released', x => x.topReleased], ['Total hours', x => (intake ? x.cmPlanned : x.plannedH)]].concat(intake ? [['CA hours (fixed)', x => x.ca]] : []).map(([l, f], i) => html`<tr key=${i} className=${l === 'Total hours' ? 'strong' : ''}><td className="fc">${l}</td>${months.map((x, j) => html`<td key=${j} className="r">${hn(f(x))}</td>`)}<td className="r">${hn(sum(months.map(f)))}</td></tr>`)}
        <tr className="strong"><td className="fc">Cost</td>${months.map((x, j) => { const c = intake ? (x.master + x.open + x.topReleased) * run.rates.cm[j] + x.ca * run.rates.ca[j] : (x.master + x.open + x.topReleased) * rateM[j]; return html`<td key=${j} className="r">${money(c)}</td>`; })}<td className="r">${money(sum(run.cost[intake ? 'cm' : 'clin'][uid].map((c, j) => c.master + c.open + c.top + (intake ? run.cost.ca[uid][j].master : 0))))}</td></tr></tbody></table></div><//>
    <${Sec} title="Charts" sub="Hourly demand vs supply for one month and weekday" open=${opn.chart} toggle=${() => tg('chart')}>
      <div className="row"><${Field} label="Weekday"><${Seg} value=${cd} onChange=${setCd} options=${DOW.map((d, i) => ({ v: i, l: d }))} /><//><span className="mute">${MONTHS[chartM]} (month selected above)</span></div>
      <div className="grid2"><${Chart} labels=${hrs} series=${[{ type: 'bar', name: 'Demand ÷ CPH', values: Array.from({ length: 24 }, (_, h) => cx.demand[h][cd] / mt.cph), color: 'var(--c5)', opacity: 0.45 }, { type: 'step', name: 'Reduced supply', values: Array.from({ length: 24 }, (_, h) => cx.red[h][cd] + (intake ? cx.caM[h][cd] : 0)), color: 'var(--c2)' }, { type: 'step', name: 'Scheduled (blocks)', values: sched.map((v, h) => v + (intake ? cx.caM[h][cd] : 0)), color: 'var(--c1)' }]} yFmt=${fmt1} h=${270} />
        <${Chart} labels=${hrs} series=${[{ type: 'bar', name: 'Consults/hr', values: Array.from({ length: 24 }, (_, h) => cx.demand[h][cd]), color: 'var(--c5)', opacity: 0.4 }, { type: 'line', name: 'SLA (right)', values: Array.from({ length: 24 }, (_, h) => (cx.sla.hs[h][cd] == null ? 0 : cx.sla.hs[h][cd])), axis: 'r', color: 'var(--c3)' }]} y2Max=${1} y2Fmt=${v => (v * 100).toFixed(0) + '%'} yFmt=${fmt1} refR=${[{ v: tgt.pct, label: 'target' }]} h=${270} /></div><//>
  </div>`;
}

// ================= SOURCES =================
function SourcesTab({ p }) {
  return html`<div className="stack">
    <${Card} title="How the plan follows your documents">
      <table className="t sm"><thead><tr><th>Your document / section</th><th>Where it is in this plan</th></tr></thead><tbody>
        <tr><td><b>Forecasts – National Forecast</b>: lives (row 3) → utilization (rows 18–19) → consults (26 / 101) → automation (31–32 / 107) → revised consults (33 / 108) → regional distribution (44–50 / 111–117) → weekly view (89–94 / 163–169) → CPH (70–75 / 145–150)</td><td>Inputs tab: the same chain (lives with optional annual growth, utilization, automation, regional distribution, weekly view) plus CPH, occupancy and rates by month. <i>Sheet weekly values</i> and <i>Manual by province</i> are alternative sources.</td></tr>
        <tr><td><b>Clinical province tabs</b>: % distribution (rows 5–31), demand/hour (33–61), supply required (64–91), reduced supply (95–121), wait and SLA (123–238), shift blocks (243–258), master (262–275), open (293–306), top-ups (308–321), Hours and COGs</td><td>Province tabs, one per province, same sections in the same order, months side by side as 7-column blocks (SUN–SAT), or a single editable month.</td></tr>
        <tr><td><b>Intake tabs</b>: single contact centre supply, CA:CM ratio, CM requirement, CM master / open / top-ups</td><td>Intake tabs (QC, ON, BC, AB/SK/MB/Terr, NS/NB/PE/NL). CM = ROUNDUP(total ÷ ratio); CA is the remainder and is costed as a fixed pool; only CM goes through master → open → top-ups.</td></tr></tbody></table><//>
    <${Card} title="Formulas replicated from the sheets">
      <ul className="gaps"><li><b>Demand per hour</b> = ROUND(weekly forecast × hourly %, 0).</li>
        <li><b>Supply required</b> = MAX(ROUND(demand ÷ CPH, 0), 1) for clinical; MAX(CEILING(demand ÷ CPH), 1) for intake. The Erlang C option instead finds the smallest agent count meeting your wait threshold and SLA %.</li>
        <li><b>Reduced supply</b> = MAX(ROUND(required × availability), 1). Availability defaults are the per-tab inputs read from the sheets (QC 95%, ON 90%, BC 85%, AB 88%, NB/NS/NL 80%).</li>
        <li><b>Wait and SLA (sheet method)</b>: consults in wait = ROUND(MAX(peak-adjusted demand − supply × CPH, 0)), peak factors 1.15 (10–18 consults) and 1.30 (above 18); wait minutes = in-wait × (1 ÷ CPH) ÷ supply × 60 × a congestion multiplier (1, 2.5 or 3.5); hourly SLA = share of consults not waiting past the threshold, capped at 95%; daily and monthly SLA are volume-weighted.</li>
        <li><b>Shift blocks</b>: each hour is assigned to a block by its label hour; block staffing = ROUND(AVERAGE of reduced supply in the block); hours = staffing × Hrs Covered × weekday counts.</li>
        <li><b>Master / open / top-up</b>: master = block minimum over Nov–Apr and May–Oct less the master buffer; open = minimum of the remainder over Nov–Jan, Feb–Apr, May–Jun, Jul–Oct less the open buffer; top-up = what is left each month.</li></ul><//>
    <${Card} title="How closely it reproduces your January 2027 numbers">
      <p className="note">With the availability inputs above, QC reduced required hours come to about 6,901 vs 6,913 in the sheet and staffed hours 7,036 vs 7,044; BC reduced required 1,658 (exact); NB reduced 948 and staffed 650 (exact); intake CM hourly requirement ties exactly for AB/SK/MB/Terr (1,071), BC (1,332) and ON (3,252). Gaps: ON runs about 7% above the sheet, QC intake about 4% below, and the NS/NB/PE/NL CA:CM ratio was set to 1.8 (the importrange says 2.0) to match the sheet's 1,656 CM hours.</p><//>
    <${Card} title="Assumptions to check">
      <ul className="gaps"><li><b>Hourly shape</b>: January block applied to every month, one profile per tab. MB and SK use the AB shape and PE the Atlantic shape because their tabs weren't read; their demand is so small that supply is the one-NP minimum either way.</li>
        <li><b>Master / open buffers</b> (25% / 10%) are placeholders chosen to land near the sheet's master share; enter the actual master and open schedules into the shaded cells for the month.</li>
        <li><b>Shift blocks for BC, AB, NB, NL, NS, MB</b> were read from their tabs; SK and PE are assumed to equal MB, and BC/PR/ATL intake blocks equal QC/ON intake.</li>
        <li><b>Head counts</b> remain the 2025-vintage values from the FTE tabs; MB, SK and PE have none.</li>
        <li><b>Time zones</b>: BC (−3 h) and AB / Prairies (−2 h) show local labels over EST rows as in the sheet. A row can fall on the previous local day; the sheet keeps it in the same weekday column and so does this plan.</li></ul><//>
  </div>`;
}

// ================= APP =================
function load() { try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.ver === 5 && Array.isArray(o.plans) && o.plans.length && o.plans.every(x => x.fte && x.engine && x.manualClin && x.ov && x.avail && x.blocks && x.peak && Array.isArray(x.cph.clin.QC) && x.lives.dist && x.extras)) return o; } catch (e) { /* ignore */ } return null; }
function App({ initialTab }) {
  const saved = useMemo(load, []);
  const [plans, setPlans] = useState(saved ? saved.plans : [C.mkPlan()]);
  const [activeId, setActiveId] = useState(saved && saved.plans.some(x => x.id === saved.activeId) ? saved.activeId : plans[0].id);
  const [tab, setTab] = useState(initialTab || 'sum'), [theme, setTheme] = useState('auto');
  const raw = plans.find(x => x.id === activeId) || plans[0];
  const dp = useDeferredValue(raw);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ ver: 5, plans, activeId: raw.id })); } catch (e) { /* ignore */ } }, [plans, activeId]);
  useEffect(() => { const r = document.documentElement; if (theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', theme); }, [theme]);
  const run = useMemo(() => C.runPlan(dp), [dp]);
  const set = (path, val) => setPlans(ps => ps.map(x => (x.id === raw.id ? setIn(x, path, val) : x)));
  const onDup = () => { const c = clone(raw); c.id = 'p' + Date.now().toString(36); c.name = raw.name + ' copy'; setPlans(ps => ps.concat([c])); setActiveId(c.id); };
  const onDel = () => { if (plans.length < 2) return; const rest = plans.filter(x => x.id !== raw.id); setPlans(rest); setActiveId(rest[0].id); };
  const onReset = () => { const d = C.mkPlan(); setPlans([d]); setActiveId(d.id); };
  // KPIs
  const units = [];
  clinIds.forEach(i => { if (run.units.clin[i]) units.push(run.units.clin[i].months); });
  const clinH = sum(clinIds.map(i => sum(run.units.clin[i].months.map(x => x.plannedH))));
  const cmH = sum(REGIONS.map(r => sum(run.units.int[r].months.map(x => x.cmPlanned)))), caH = sum(REGIONS.map(r => sum(run.units.int[r].months.map(x => x.ca))));
  const wsl = (list) => { const d = sum(list.map(x => x.den || 0)); return d ? sum(list.map(x => (x.sl || 0) * (x.den || 0))) / d : 1; };
  const slC = wsl([].concat(...clinIds.map(i => run.units.clin[i].months))), slI = wsl([].concat(...REGIONS.map(r => run.units.int[r].months)));
  const peakHire = Math.max(...MONTHS.map((_, m) => sum(['clin', 'cm', 'ca'].map(k => sum(Object.keys(run.fte[k]).map(u => run.fte[k][u][m].hireFTE))))));
  const cogsTotal = sum(run.cogs.total), cogsHours = sum(run.cogs.hours), cogsExtra = sum(run.cogs.extraM) + sum(run.cogs.stipend);
  const tabs = [{ v: 'sum', l: 'Plan summary' }, { v: 'inp', l: 'Inputs' }, { v: 'fc', l: 'Forecast by province' }, { v: 'hrs', l: 'Hours & top-ups' }, { v: 'fte', l: 'FTE & hiring' }, { v: 'perf', l: 'Expected performance' }, { v: 'prov', l: 'Province tabs' }, { v: 'src', l: 'Sources & notes' }];
  return html`<div className="app">
    <header className="top"><div className="titlerow"><div><h1>2027 Capacity Plan <span>by province · Clinical + Intake</span></h1><p className="tag">Built from the Forecasts, Enhanced Clinical and Intakes sheets (RD1.V10B) · manual entry anywhere</p></div>
      <button className="btn ghost" onClick=${() => setTheme(theme === 'dark' ? 'light' : theme === 'light' ? 'auto' : 'dark')}>${'Theme: ' + (theme === 'dark' ? 'Dark' : theme === 'light' ? 'Light' : 'Auto')}</button></div>
      <div className="scenrow"><span className="slab">Plan</span>${plans.map(x => html`<button key=${x.id} className=${'schip ' + (x.id === raw.id ? 'on' : '')} onClick=${() => setActiveId(x.id)}>${x.name}</button>`)}
        <input className="rename" style=${{ width: 220 }} value=${raw.name} onChange=${e => set(['name'], e.target.value)} aria-label="Plan name" />
        <button className="btn" onClick=${onDup}>Duplicate</button><button className="btn" onClick=${onDel} disabled=${plans.length < 2}>Delete</button><button className="btn ghost" onClick=${onReset}>Reset to sheet</button></div>
      <div className=${'kpis ' + (raw !== dp ? 'pending' : '')}>
        <div><i>Planned hours</i><b>${fmt0(clinH + cmH + caH)}</b><em>NP ${fmt0(clinH)} · CM ${fmt0(cmH)} · CA ${fmt0(caH)}</em></div>
        <div><i>Total COGS</i><b>${moneyM(cogsTotal)}</b><em>hours ${moneyM(cogsHours)} + additional ${moneyM(cogsExtra)}</em></div>
        <div className=${slI >= raw.sla.int.pct ? 'ok' : 'no'}><i>Intake service level</i><b>${pct1(slI)}</b><em>target ${Math.round(raw.sla.int.pct * 100)}% ≤ ${raw.sla.int.mins}m</em></div>
        <div className=${slC >= raw.sla.clin.pct ? 'ok' : 'no'}><i>Clinical service level</i><b>${pct1(slC)}</b><em>target ${Math.round(raw.sla.clin.pct * 100)}% ≤ ${raw.sla.clin.mins}m</em></div>
        <div className=${peakHire > 0.5 ? 'no' : 'ok'}><i>Peak shortage</i><b>${fmt1(peakHire)} FTE</b><em>across all units, worst month</em></div></div></header>
    <nav className="tabs">${tabs.map(x => html`<button key=${x.v} className=${tab === x.v ? 'on' : ''} onClick=${() => setTab(x.v)}>${x.l}</button>`)}</nav>
    <main>${tab === 'sum' ? html`<${SummaryTab} p=${dp} run=${run} />` : null}${tab === 'inp' ? html`<${InputsTab} p=${raw} set=${set} run=${run} />` : null}${tab === 'fc' ? html`<${ForecastTab} p=${raw} set=${set} run=${run} />` : null}${tab === 'hrs' ? html`<${HoursTab} p=${raw} set=${set} run=${run} />` : null}
      ${tab === 'fte' ? html`<${FTETab} p=${raw} set=${set} run=${run} />` : null}${tab === 'perf' ? html`<${PerfTab} p=${dp} set=${set} run=${run} />` : null}${tab === 'prov' ? html`<${ProvTab} p=${raw} set=${set} run=${run} />` : null}${tab === 'src' ? html`<${SourcesTab} p=${raw} />` : null}</main>
    <footer>Plans and edits stay in this browser only. This page and the Budget model are independent; the hourly engine is the same, the inputs and calibration are not.</footer></div>`;
}
window.__CapApp = App;
if (typeof document !== 'undefined' && document.getElementById('root')) ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();

</script>
</body></html>
